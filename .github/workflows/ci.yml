name: Test, build, and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Python, frontend, and MySQL checks
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: ci-only-ephemeral-test-secret-never-use-in-production-2026-10-26
      DJANGO_DEBUG: "true"
      MYSQL_DATABASE: textbench
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root-password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      BROWSER_CHANNEL: chrome
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: textbench
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Audit pinned Python dependencies
        run: pip-audit -r backend/requirements-dev.txt --no-deps --disable-pip
      - name: Check Python style
        run: |
          ruff check .
          ruff format --check .
      - name: Check frontend source and tools
        run: |
          npm ci --ignore-scripts
          npm audit
          npm run format:check
          node --check frontend/static/app.js
      - name: Check configuration and migration consistency
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
          python backend/manage.py migrate --noinput
      - name: Test against real MySQL
        run: pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Validate OpenAPI
        run: python backend/manage.py spectacular --file /tmp/textbench-schema.yml --validate --fail-on-warn
      - name: Check deployment settings
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECURE_COOKIES: "true"
          DJANGO_SSL_REDIRECT: "true"
        run: python backend/manage.py check --deploy --fail-level WARNING
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t textbench:ci .
      - name: Smoke test the complete Docker Compose application
        env:
          MYSQL_USER: textbench
          MYSQL_PASSWORD: local-textbench-password
          MYSQL_ROOT_PASSWORD: local-root-password
        run: |
          cp .env.example .env
          docker stop "${{ job.services.mysql.id }}"
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/api/health/
          curl --fail http://localhost:8000/ > /tmp/textbench.html
          npm run test:browser
      - name: Stop smoke-test containers
        if: always()
        run: if [ -f .env ]; then docker compose down; fi
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  publish:
    name: Publish Docker image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set immutable image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to your server
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      IMAGE: ${{ needs.publish.outputs.image }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy deployment files
        run: |
          scp -P "$SSH_PORT" compose.production.yml Caddyfile "$SSH_USER@$SSH_HOST:/opt/textbench/"
          scp -P "$SSH_PORT" scripts/deploy.sh "$SSH_USER@$SSH_HOST:/opt/textbench/scripts/"
      - name: Start release and check HTTPS
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd /opt/textbench && IMAGE='$IMAGE' bash scripts/deploy.sh"
          curl --fail --retry 12 --retry-delay 10 "https://$APP_DOMAIN/api/health/"
